name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  metrics:
    name: Collect metrics
    uses: anolishq/.github/.github/workflows/metrics.yml@260e6a2c364562a14e1f35a118dbea6e0ada9041 # v2
    with:
      tag: ${{ github.ref_name }}

  release-linux-x86_64:
    name: Release (linux-x86_64)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ jq

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@a9b3d134acbcc7dcd6da02c1a345a1fbdca15064 # v2.4
        with:
          triplet: x64-linux-static
          # Subset of the linux-fluxgraph closure (no grpc/fluxgraph); read-only
          # so it can't clobber the shared x64-linux-static key (see ci.yml).
          cache-write: "false"

      - name: Setup Python and dependencies
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Configure
        run: cmake --preset ci-linux-release-strict

      - name: Build
        run: cmake --build --preset ci-linux-release-strict --parallel

      - name: Test
        run: ctest --preset ci-linux-release-strict -L provider

      - name: Package binary artifact
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="anolis-provider-sim-${VERSION}-linux-x86_64.tar.gz"
          BINARY="build/ci-linux-release-strict/anolis-provider-sim"
          if [ ! -f "${BINARY}" ]; then
            echo "ERROR: binary not found at ${BINARY}" >&2
            exit 1
          fi
          mkdir -p staging/bin
          cp "${BINARY}" staging/bin/
          tar -czf "${ARTIFACT}" -C staging .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Package source tarball
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git archive --format=tar.gz \
            --prefix="anolis-provider-sim-${VERSION}/" \
            -o "anolis-provider-sim-${VERSION}-source.tar.gz" \
            HEAD

      - name: Emit config schema envelope (executable profile v1 §2)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BINARY="build/ci-linux-release-strict/anolis-provider-sim"
          ENVELOPE="anolis-provider-sim-${VERSION}-config-schema.json"
          "${BINARY}" --config-schema > "${ENVELOPE}"
          python3 -c "import json; d=json.load(open('${ENVELOPE}')); v=d.get('config_schema_version'); assert isinstance(v, int) and not isinstance(v, bool) and v >= 1 and isinstance(d.get('schema'), dict), 'invalid envelope'"
          SHA=$(sha256sum "${ENVELOPE}" | awk '{print $1}')
          jq -n \
            --argjson schema_version 1 \
            --arg repo "anolishq/anolis-provider-sim" \
            --arg component "provider-config-schema" \
            --arg version "${VERSION}" \
            --arg asset "${ENVELOPE}" \
            --arg sha256 "${SHA}" \
            '{schema_version: $schema_version, repo: $repo, component: $component, version: $version, asset: $asset, sha256: $sha256}' \
            > "anolis-provider-sim-${VERSION}-config-schema-manifest.json"

      - name: Generate checksums
        run: sha256sum anolis-provider-sim-*.tar.gz > SHA256SUMS

      - name: Generate manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="${{ steps.package.outputs.artifact }}"
          SHA=$(grep "${ARTIFACT}" SHA256SUMS | awk '{print $1}')
          jq -n \
            --argjson schema_version 1 \
            --arg repo "anolishq/anolis-provider-sim" \
            --arg component "anolis_provider_sim" \
            --arg version "${VERSION}" \
            --arg platform "linux-x86_64" \
            --arg asset "${ARTIFACT}" \
            --arg sha256 "${SHA}" \
            '{schema_version: $schema_version, repo: $repo, component: $component, version: $version, platform: $platform, asset: $asset, sha256: $sha256}' \
            > manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            anolis-provider-sim-*.tar.gz
            anolis-provider-sim-*-config-schema.json
            anolis-provider-sim-*-config-schema-manifest.json
            SHA256SUMS
            manifest.json
          generate_release_notes: true

  release-linux-arm64:
    name: Release (linux-arm64)
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ jq

      - name: Extract version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Setup vcpkg
        uses: anolishq/.github/.github/actions/setup-vcpkg@a9b3d134acbcc7dcd6da02c1a345a1fbdca15064 # v2.4
        with:
          triplet: arm64-linux

      - name: Setup Python and dependencies
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-lock.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Configure
        run: cmake --preset ci-linux-arm64-release-strict

      - name: Build
        run: cmake --build --preset ci-linux-arm64-release-strict --parallel

      - name: Test
        run: ctest --preset ci-linux-arm64-release-strict -L provider

      - name: Package binary artifact
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="anolis-provider-sim-${VERSION}-linux-arm64.tar.gz"
          BINARY="build/ci-linux-arm64-release-strict/anolis-provider-sim"
          if [ ! -f "${BINARY}" ]; then
            echo "ERROR: binary not found at ${BINARY}" >&2
            exit 1
          fi
          mkdir -p staging/bin
          cp "${BINARY}" staging/bin/
          tar -czf "${ARTIFACT}" -C staging .
          echo "artifact=${ARTIFACT}" >> "$GITHUB_OUTPUT"

      - name: Generate manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ARTIFACT="${{ steps.package.outputs.artifact }}"
          SHA=$(sha256sum "${ARTIFACT}" | awk '{print $1}')
          jq -n \
            --argjson schema_version 1 \
            --arg repo "anolishq/anolis-provider-sim" \
            --arg component "anolis_provider_sim" \
            --arg version "${VERSION}" \
            --arg platform "linux-arm64" \
            --arg asset "${ARTIFACT}" \
            --arg sha256 "${SHA}" \
            '{schema_version: $schema_version, repo: $repo, component: $component, version: $version, platform: $platform, asset: $asset, sha256: $sha256}' \
            > manifest-linux-arm64.json

      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            anolis-provider-sim-*-linux-arm64.tar.gz
            manifest-linux-arm64.json

  aggregate-checksums:
    name: Aggregate checksums
    runs-on: ubuntu-24.04
    needs: [release-linux-x86_64, release-linux-arm64]
    steps:
      - name: Regenerate SHA256SUMS across all release tarballs
        env:
          GH_TOKEN: ${{ github.token }}
        # Each arch job uploads its tarball independently; the x86_64 job's
        # SHA256SUMS does not cover the arm64 asset. Rebuild the checksum
        # file from every tarball attached to the release, then replace it.
        run: |
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --pattern 'anolis-provider-sim-*.tar.gz'
          sha256sum anolis-provider-sim-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS --clobber --repo "${GITHUB_REPOSITORY}"

  upload-metrics:
    name: Upload metrics to release
    runs-on: ubuntu-24.04
    needs: [release-linux-x86_64, release-linux-arm64, metrics]
    steps:
      - name: Download metrics artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: metrics-${{ github.event.repository.name }}-${{ github.run_number }}
          path: metrics-out/

      - name: Upload metrics.json to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: metrics-out/metrics.json
