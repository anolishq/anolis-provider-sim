# Cross-repo compatibility refs consumed by provider compatibility lanes.
# FluxGraph is pinned to a release tag (`ref` below), bumped by hand. CI's
# "Resolve FluxGraph pin" step checks out that ref to build fluxgraph-server.

fluxgraph:
  repository: anolishq/fluxgraph
  ref: v1.0.6
  updated_utc: 2026-10-21
  rationale: "Pinned to v1.0.6 release. Linux CI uses this ref to build fluxgraph-server for test execution."
